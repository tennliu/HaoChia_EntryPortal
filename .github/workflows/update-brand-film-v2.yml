name: Update HaoChia brand film v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-brand-film-v2.yml'

permissions:
  contents: write

jobs:
  update-film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified master from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown --id '1LTx59wN69VFsWXtCmuxMYjSmOI3qcpij' -O /tmp/haochia-master.mp4
          echo '835886e2a80fa5d8dcb0723d16cb50c5186efa8780db904ae36daef7ccc5d5d0  /tmp/haochia-master.mp4' | sha256sum -c -
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/haochia-master.mp4

      - name: Encode web-optimized 1080p MP4 and poster
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y -i /tmp/haochia-master.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -c:v libx264 -preset medium -crf 23 \
            -profile:v high -level 4.1 -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            -movflags +faststart \
            shared/assets/haochia-brand-film-90s-v2.mp4
          ffmpeg -hide_banner -y -ss 90 -i /tmp/haochia-master.mp4 \
            -frames:v 1 -q:v 2 shared/assets/haochia-brand-film-90s-v2-poster.jpg
          test "$(stat -c%s shared/assets/haochia-brand-film-90s-v2.mp4)" -lt 100000000
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate -of json shared/assets/haochia-brand-film-90s-v2.mp4
          ls -lh shared/assets/haochia-brand-film-90s-v2.mp4 shared/assets/haochia-brand-film-90s-v2-poster.jpg

      - name: Switch desktop/mobile/Guide to the new film and refine cue timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files=[Path('web/index.html'),Path('phone/index.html')]
          for p in files:
              s=p.read_text(encoding='utf-8')
              s=s.replace('../shared/assets/haochia-wip.mp4','../shared/assets/haochia-brand-film-90s-v2.mp4')
              s=s.replace('../shared/assets/haochia-wip-poster.jpg','../shared/assets/haochia-brand-film-90s-v2-poster.jpg')
              # New master enters the circular-resource chapter at ~40s rather than 37s.
              s=s.replace('{t:37,target:"cycle"','{t:40,target:"cycle"')
              p.write_text(s,encoding='utf-8')

          # Keep the package clean: git history remains the rollback source.
          for old in [Path('shared/assets/haochia-wip.mp4'),Path('shared/assets/haochia-wip-poster.jpg')]:
              if old.exists(): old.unlink()

          # Runtime HTML must no longer reference the old media.
          leftovers=[]
          for p in files:
              if 'haochia-wip' in p.read_text(encoding='utf-8'): leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Old film references remain: '+', '.join(leftovers))
          PY

      - name: Update handoff notes
        shell: bash
        run: |
          cat >> README.md <<'MD'

          ## Brand film v2
          - Master source: `智慧好嘉_循環經濟品牌生態影片_90s_中英文字幕版本.mp4` (93s, 1920×1080 H.264/AAC).
          - Runtime file: `shared/assets/haochia-brand-film-90s-v2.mp4`, re-encoded as H.264/AAC with `faststart` for web delivery.
          - Poster: `shared/assets/haochia-brand-film-90s-v2-poster.jpg` from the final brand frame.
          - Guide cue timing: intro 0s / smart 9s / cycle 40s / partner 63s / CTA 75s.
          - The original client-facing `HaoChia_Portal` repository remains unchanged.
          MD

      - name: Commit updated film
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'media: update to 90s bilingual HaoChia brand film'
          git push origin main
